name: Compilar SemeParaEQ (macOS)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Compilar universal (Apple Silicon e Intel)
        run: |
          SRC=$(dirname "$(find . -name CMakeLists.txt -not -path './build/*' | head -n 1)")
          echo "Proyecto encontrado en $SRC"
          cmake -S "$SRC" -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j 4

      - name: Empaquetar y firmar
        run: |
          SRC=$(dirname "$(find . -name CMakeLists.txt -not -path './build/*' | head -n 1)")
          mkdir out
          cp -R "$(find build -name '*.vst3' -maxdepth 6 | head -n 1)" out/
          cp -R "$(find build -name '*.component' -maxdepth 6 | head -n 1)" out/
          for p in out/*.vst3 out/*.component; do codesign --force --deep -s - "$p"; done
          cp "$SRC/Instalar.command" out/

      - uses: actions/upload-artifact@v4
        with:
          name: SemeParaEQ-macOS
          path: out
